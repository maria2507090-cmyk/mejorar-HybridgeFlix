
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HybridgeFlix</title>

    <!-- Importar Tailwind CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-gray-100 p-6">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">

        <h1 class="text-2xl font-bold mb-4">
            HybridgeFlix
        </h1>

        <!-- FORMULARIO -->
        <form id="formularioPelicula" class="mb-6">

            <!-- Título -->
            <div class="mb-4">
                <label for="titulo"
                    class="block text-gray-700 font-bold mb-2">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    class="shadow border rounded w-full py-2 px-3"
                    required
                >
            </div>

            <!-- Año -->
            <div class="mb-4">
                <label for="anio"
                    class="block text-gray-700 font-bold mb-2">
                    Año
                </label>

                <input
                    type="number"
                    id="anio"
                    class="shadow border rounded w-full py-2 px-3"
                    required
                >
            </div>

            <!-- Calificación -->
            <div class="mb-4">
                <label for="calificacion"
                    class="block text-gray-700 font-bold mb-2">
                    Calificación (1-10)
                </label>

                <input
                    type="number"
                    id="calificacion"
                    min="1"
                    max="10"
                    class="shadow border rounded w-full py-2 px-3"
                    required
                >
            </div>

            <!-- Reseña -->
            <div class="mb-4">
                <label for="resena"
                    class="block text-gray-700 font-bold mb-2">
                    Reseña
                </label>

                <textarea
                    id="resena"
                    class="shadow border rounded w-full py-2 px-3"
                    rows="4"
                    required
                ></textarea>
            </div>

            <!-- NUEVO CAMPO: URL DEL PÓSTER -->
            <div class="mb-4">
                <label for="poster"
                    class="block text-gray-700 font-bold mb-2">
                    URL del póster
                </label>

                <input
                    type="url"
                    id="poster"
                    placeholder="https://ejemplo.com/poster.jpg"
                    class="shadow border rounded w-full py-2 px-3"
                    required
                >
            </div>

            <!-- Botón -->
            <button
                type="submit"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
            >
                Guardar
            </button>

        </form>

        <!-- TABLA DE PELÍCULAS -->
        <div class="overflow-x-auto">

            <table class="min-w-full bg-white">

                <thead>
                    <tr>
                        <th class="py-2 px-4 border-b-2 text-left">
                            Título
                        </th>

                        <th class="py-2 px-4 border-b-2 text-left">
                            Año
                        </th>

                        <th class="py-2 px-4 border-b-2 text-left">
                            Calificación
                        </th>

                        <th class="py-2 px-4 border-b-2 text-left">
                            Reseña
                        </th>

                        <!-- NUEVA COLUMNA -->
                        <th class="py-2 px-4 border-b-2 text-left">
                            Póster
                        </th>
                    </tr>
                </thead>

                <tbody id="cuerpoTablaPeliculas">
                    <!-- Aquí aparecerán las películas -->
                </tbody>

            </table>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>

        document.getElementById('formularioPelicula')
            .addEventListener('submit', function(e) {

                // Evitar que se recargue la página
                e.preventDefault();

                // Obtener los datos del formulario
                const titulo =
                    document.getElementById('titulo').value;

                const anio =
                    document.getElementById('anio').value;

                const calificacion =
                    document.getElementById('calificacion').value;

                const resena =
                    document.getElementById('resena').value;

                // Obtener la URL del póster
                const poster =
                    document.getElementById('poster').value;

                // Crear una nueva fila
                const nuevaFila = document.createElement('tr');

                // Función para agregar celdas de texto
                function agregarCelda(texto) {
                    const celda = document.createElement('td');

                    celda.className =
                        'py-2 px-4 border-b border-gray-300';

                    celda.textContent = texto;

                    nuevaFila.appendChild(celda);
                }

                // Agregar información de la película
                agregarCelda(titulo);
                agregarCelda(anio);
                agregarCelda(calificacion);
                agregarCelda(resena);

                // Crear la celda del póster
                const celdaPoster = document.createElement('td');

                celdaPoster.className =
                    'py-2 px-4 border-b border-gray-300';

                // Crear la imagen del póster
                const imagenPoster = document.createElement('img');

                imagenPoster.src = poster;
                imagenPoster.alt = 'Póster de ' + titulo;

                // Definir el tamaño de la imagen
                imagenPoster.width = 80;
                imagenPoster.height = 120;

                imagenPoster.style.objectFit = 'cover';
                imagenPoster.style.borderRadius = '6px';

                // Agregar imagen a su celda
                celdaPoster.appendChild(imagenPoster);

                // Agregar celda a la fila
                nuevaFila.appendChild(celdaPoster);

                // Agregar fila a la tabla
                document.getElementById('cuerpoTablaPeliculas')
                    .appendChild(nuevaFila);

                // Limpiar formulario
                document.getElementById('formularioPelicula')
                    .reset();

            });

    </script>

</body>
</html>
